# =============================================================================
# Deploy — parametrizado por GitHub Environment, NAO por branch.
#
# Ambientes: dev | test | homolog | prod
#   - dev      : automatico a cada push em main (DESLIGADO ate o deploy existir, ver `on:`)
#   - test     : manual (workflow_dispatch)
#   - homolog  : manual, com aprovacao obrigatoria (required reviewers)
#   - prod     : manual ou via release publicada, com aprovacao obrigatoria
#
# A aprovacao manual NAO fica neste arquivo: ela e uma protection rule do
# Environment, configurada na interface do GitHub (SETUP-GITHUB.md). Isso
# mantem o pipeline identico para os quatro ambientes e a politica onde ela
# pertence — na governanca do repositorio.
#
# AGNOSTICO DE PLATAFORMA: este workflow cuida do que nao depende de para
# onde se publica — gatilhos, escolha do ambiente, aprovacao, credenciais,
# build, smoke test e resumo. A publicacao em si e `scripts/deploy.sh`.
# Trocar S3 por Vercel, Netlify ou container nao muda este arquivo.
# Receitas prontas: DEPLOY.md
# =============================================================================
name: Deploy

on:
  # Desligado ate existir VPS e dominio (A7 em shared/OWNER.md) e o scripts/deploy.sh:
  # sem eles, o deploy em `dev` falha a cada push em main e manda e-mail de erro.
  # Para religar, devolva o gatilho:
  #   push:
  #     branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        type: choice
        required: true
        default: dev
        options: [dev, test, homolog, prod]
      ref:
        description: 'Branch, tag ou SHA a publicar (padrao: a ref atual)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Traduz o gatilho em um nome de Environment. Um unico lugar decide isso.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolver ambiente
    # O repositorio template nao tem o que publicar.
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          case "$EVENT" in
            workflow_dispatch) environment="$INPUT_ENV" ;;
            release)           environment="prod" ;;
            push)              environment="dev" ;;
            *)                 echo "::error::Gatilho nao suportado: $EVENT"; exit 1 ;;
          esac
          ref="${INPUT_REF:-${{ github.sha }}}"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "ref=$ref"                 >> "$GITHUB_OUTPUT"
          echo "### Deploy para \`$environment\` (ref \`$ref\`)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build + publicacao.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 30

    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ vars.APP_BASE_URL }}

    permissions:
      contents: read
      # Exigido por OIDC (AWS, GCP, Azure). Inofensivo se a plataforma
      # escolhida usar token: o job so obtem o id-token se pedir.
      id-token: write

    # Dois deploys simultaneos no mesmo ambiente se sobrescrevem; nao
    # cancelamos o que ja esta em andamento para nao deixar o destino em
    # estado parcial.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - run: make setup

      # -----------------------------------------------------------------------
      # Credenciais da plataforma.
      #
      # Descomente o bloco correspondente e configure os secrets do
      # Environment. Preferir sempre OIDC a chave de longa duracao.
      # Receitas completas em DEPLOY.md.
      # -----------------------------------------------------------------------
      # - name: Credenciais AWS (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      #     role-session-name: gha-${{ needs.resolve.outputs.environment }}-${{ github.run_id }}
      #
      # - name: Credenciais Google Cloud (OIDC)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      #
      # - name: Credenciais Azure (OIDC)
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ vars.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ vars.AZURE_TENANT_ID }}
      #     subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build
        env:
          # Variaveis de build do ambiente. Os nomes dependem da stack —
          # declare-os em .env.example e nas variables do Environment.
          APP_ENV: ${{ needs.resolve.outputs.environment }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: make build

      - name: Publicar
        env:
          DEPLOY_ENV: ${{ needs.resolve.outputs.environment }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          # Repasse aqui os secrets/variables que scripts/deploy.sh usa.
          # Ex.: S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, VERCEL_TOKEN,
          #      NETLIFY_SITE_ID, CLOUDFLARE_ACCOUNT_ID.
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: make deploy

      - name: Smoke test do ambiente publicado
        if: ${{ vars.APP_BASE_URL != '' }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
            --retry-all-errors "${{ vars.APP_BASE_URL }}")
          echo "GET ${{ vars.APP_BASE_URL }} -> $status"
          [ "$status" = "200" ] || { echo "::error::Smoke test falhou (HTTP $status)"; exit 1; }

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy ${{ needs.resolve.outputs.environment }}"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Ambiente | \`${{ needs.resolve.outputs.environment }}\` |"
            echo "| Ref | \`${{ needs.resolve.outputs.ref }}\` |"
            echo "| URL | ${{ vars.APP_BASE_URL }} |"
            echo "| Resultado | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
