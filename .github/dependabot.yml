# =============================================================================
# Dependabot.
#
# Ativo: `github-actions`, que vale para qualquer stack.
# Os demais ecossistemas estao comentados — descomente o da stack escolhida
# (SETUP-GITHUB.md, secao B8).
#
# Os prefixos de commit-message seguem Conventional Commits, senao o CI
# reprova os proprios PRs do Dependabot.
# =============================================================================
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ['ci-cd', 'dependencias']
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Um PR por grupo em vez de um por action: menos ruido, mesma seguranca.
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

