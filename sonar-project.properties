# =============================================================================
# SonarCloud.
#
# Ajuste organization/projectKey ao criar o projeto real (SETUP-GITHUB.md).
# Os caminhos abaixo presumem codigo em `src/` e testes ao lado — ajuste a
# estrutura escolhida no ARCHITECTURE.md.
# =============================================================================
sonar.organization=SUA-ORGANIZACAO
sonar.projectKey=SUA-ORGANIZACAO_SEU-REPOSITORIO
sonar.projectName=Seu Projeto

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**

sonar.exclusions=node_modules/**,dist/**,build/**,out/**,coverage/**,playwright-report/**,**/generated/**,**/*.config.*

sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/generated/**,**/test/**,**/mocks/**,e2e/**

# Contrato com `make test-coverage`: ele precisa produzir este arquivo.
# Praticamente toda ferramenta de cobertura sabe emitir lcov.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
