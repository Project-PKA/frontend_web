# Read by SonarCloud's Automatic Analysis, which does not use sonar-project.properties
# (the CI scan does). Without these exclusions it counted the design prototype and the
# generated API types as new code: 61% duplication, so the Quality Gate failed on every
# push and sent an e-mail. Keep this file in line with sonar-project.properties.
sonar.sources=app
sonar.exclusions=app/api/generated.ts,app/api/error-codes.json,.output/**,.nuxt/**,coverage/**,**/*.config.*
sonar.tests=app,e2e
sonar.test.inclusions=**/*.test.*,**/*.spec.*,e2e/**
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,app/api/generated.ts,app/pages/**,app/components/**,app/composables/**,app/plugins/**,app/middleware/**,app/error.vue,app/app.vue,e2e/**
